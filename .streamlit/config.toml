# 밝은 모빌리티 앱 스타일 테마
#   배경   #F4F6F5 (옅은 회녹색)   카드  #FFFFFF
#   강조   #0A8A55 (초록)          브랜드 #0F2A1F (발표자료 표지의 숲 초록, 히어로·강조 카드)
#   본문   #0F1A15                 글꼴  Pretendard

[server]
runOnSave = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#0A8A55"
backgroundColor = "#F4F6F5"
secondaryBackgroundColor = "#EEF2EF"
textColor = "#0F1A15"
linkColor = "#0A8A55"
borderColor = "#DDE4E0"
dataframeBorderColor = "#E6ECE8"
dataframeHeaderBackgroundColor = "#F7F9F8"
showWidgetBorder = true
baseRadius = "10px"
buttonRadius = "10px"
font = "Pretendard Variable:https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css, 'Malgun Gothic', sans-serif"
headingFontWeights = [800, 700, 700, 600, 600, 600]
chartCategoricalColors = ["#12B76A", "#0F2A1F", "#7CD4A6", "#B8C4BE", "#0A8A55"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F5"
borderColor = "#E6ECE8"
